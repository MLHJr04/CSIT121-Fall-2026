<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: "Lato", sans-serif;
}

.sidenav {
  height: 100%;
  width: 200px;
  position: fixed;
  z-index: 1;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;
  padding-top: 20px;
}

.sidenav a {
  padding: 6px 6px 6px 32px;
  text-decoration: none;
  font-size: 25px;
  color: #74aa1d;
  display: block;
}

.sidenav a:hover {
  color: #0f3c9e;
}

.main {
  margin-left: 200px; /* Same as the width of the sidenav */
}

@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}
</style>
</head>
<body>

<div class="sidenav">
  <a href="#">A job</a>
  <a href="#">What we do here</a>
  <a href="#">People that actually work here</a>
  <a href="#">Who to refer to</a>
</div>

<div class="main">
  <h2>Giant bar handles</h2>
  <p>Bar handles</p>
</div>
   
</body>
</html>
